name: Publish workspace clients

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'clients-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and test tools
        run: python -m pip install build twine pytest pytest-asyncio
      - name: Stage only publishable client sources
        run: |
          mkdir -p "$RUNNER_TEMP/clients-source/workspace_service"
          cp packaging/clients/pyproject.toml packaging/clients/README.md "$RUNNER_TEMP/clients-source/"
          cp -R workspace_service_client "$RUNNER_TEMP/clients-source/"
          cp workspace_service/__init__.py "$RUNNER_TEMP/clients-source/workspace_service/"
          cp -R workspace_service/provider_clients "$RUNNER_TEMP/clients-source/workspace_service/"
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("packaging/clients/pyproject.toml").read_text())
          expected = f"clients-v{metadata['project']['version']}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY
      - name: Build wheel and source distribution
        run: |
          python -m build --outdir "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/clients-source"
          python -m twine check dist/*
      - name: Check distribution contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          def allowed_source(path):
              return (
                  path == "workspace_service/__init__.py"
                  or path.startswith("workspace_service_client/")
                  or path.startswith("workspace_service/provider_clients/")
              ) and path.endswith(".py")

          wheel, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              paths = archive.namelist()
              for path in paths:
                  if ".dist-info/" not in path and not allowed_source(path):
                      raise SystemExit(f"Unexpected wheel file: {path}")
              for required in (
                  "workspace_service_client/client.py",
                  "workspace_service/provider_clients/cloudferro.py",
                  "workspace_service/provider_clients/registry.py",
              ):
                  if required not in paths:
                      raise SystemExit(f"Missing client module: {required}")
          sdist, = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  path = member.name.split("/", 1)[1]
                  if not (
                      allowed_source(path)
                      or path in {"README.md", "pyproject.toml", "PKG-INFO", "setup.cfg"}
                      or path.startswith("openeo_workspace_clients.egg-info/")
                  ):
                      raise SystemExit(f"Unexpected source distribution file: {path}")
          PY
      - name: Test installed wheel outside source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -m pytest --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/test_client.py" \
            "$GITHUB_WORKSPACE/tests/test_cloudferro.py" \
            "$GITHUB_WORKSPACE/tests/test_provider_registry.py"
          python -m workspace_service.provider_clients.cloudferro --help
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-clients-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openeo-workspace-clients
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace-clients-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
