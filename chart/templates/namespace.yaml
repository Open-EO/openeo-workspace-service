---
apiVersion: v1
kind: Namespace
metadata:
  name: openeo
  labels:
    name: openeo

---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: openeo-workspaces-network-policy
  namespace: openeo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openeo-workspaces-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Allow from same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow to Elasticsearch
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
    # Allow to KeyCloak
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8080
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS to external services
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openeo-workspaces-pdb
  namespace: openeo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openeo-workspaces-api

