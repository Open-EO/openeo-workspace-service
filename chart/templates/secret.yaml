apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openeo-workspaces-api.fullname" . }}-secrets
  labels:
    {{- include "openeo-workspaces-api.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.keycloak.external.enabled }}
  keycloak_client_secret: {{ .Values.keycloak.external.clientSecret | b64enc | quote }}
  {{- else if .Values.keycloak.enabled }}
  keycloak_client_secret: {{ .Values.keycloak.client.secret | b64enc | quote }}
  {{- end }}

  {{- if .Values.elasticsearch.external.enabled }}
  elasticsearch_password: {{ .Values.elasticsearch.external.password | b64enc | quote }}
  {{- else if .Values.elasticsearch.enabled }}
  elasticsearch_password: {{ .Values.elasticsearch.external.password | b64enc | quote }}
  {{- end }}

