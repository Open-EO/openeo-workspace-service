services:
  openeo-workspaces-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEBUG: "true"
      OIDC_ISSUER_URL: http://oidc-provider:8080/realms/master
      OIDC_CLIENT_ID: openeo-workspaces
      GIT_REPO_PATH: /app/data
    ports:
      - "8000:8000"
    networks:
      - openeo-network
    volumes:
      - .:/app
      - workspace_data:/app/data
    command: >
      bash -c "pip install -e . && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

networks:
  openeo-network:
    driver: bridge

volumes:
  workspace_data:

